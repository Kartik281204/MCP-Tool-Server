name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pinned to match .python-version / the Dockerfile, not "latest",
          # so CI is testing the same uv this project was built against.
          version: "0.11.7"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy app

      - name: pytest
        run: uv run pytest

  secret-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history -- a secret removed in a later commit is still a leak

      # The official gitleaks-action wrapper requires a paid license for
      # organization accounts (not personal ones) as of v3. The underlying
      # gitleaks CLI itself is fully open-source with no such requirement,
      # so it's installed and run directly here instead of via that action.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          chmod +x gitleaks

      - name: Scan
        run: ./gitleaks git . -v

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t mcp-tool-server .

      - name: Smoke test container
        run: |
          cp .env.example .env
          docker run -d --name smoke -p 8000:8000 --env-file .env -e MCP_HOST=0.0.0.0 mcp-tool-server

          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "health check failed -- container logs:"
          docker logs smoke
          exit 1

  publish:
    name: Publish image to GHCR
    needs: [test, docker, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker/* actions are first-party (Docker Inc.), pinned to version
      # tags rather than SHAs -- a deliberate, lighter-touch trade-off from
      # the checkout/setup-uv pins above: these see far more scrutiny than
      # a random marketplace action, so the residual risk of a mutable tag
      # is small. SHA-pin these too if this repo's threat model warrants it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        # GHCR rejects uppercase image names; github.repository preserves
        # whatever case the owner/repo actually have.
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
