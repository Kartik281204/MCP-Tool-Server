# k8s/secret.example.yaml -- TEMPLATE. Do not commit a filled-in version
# of this file to git, and do not `kubectl apply` it as-is.
#
# The Deployment references this Secret optionally (optional: true), so
# the app runs fine with no Secret present at all -- that's what "auth
# disabled by default" (see README's Authentication section) looks like
# at the Kubernetes level too.
#
# To actually use it:
#   kubectl create secret generic mcp-tool-server-secrets \
#     --from-literal=MCP_API_KEYS="key-for-client-a,key-for-client-b"
#
# For anything beyond local/demo use, prefer a real secrets manager over
# kubectl-created Secrets (which are only base64-encoded, not encrypted,
# by default) -- e.g. External Secrets Operator or Sealed Secrets syncing
# from your cloud provider's secret store.

apiVersion: v1
kind: Secret
metadata:
  name: mcp-tool-server-secrets
type: Opaque
stringData:
  MCP_API_KEYS: "replace-with-a-real-key,replace-with-another"
